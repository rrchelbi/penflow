[project]
name = "penflow"
version = "0.0.1"
description = "Composable hand-drawn SVG diagrams that explain one idea each"
readme = "README.md"
authors = [
    { name = "rrchelbi", email = "rrchelbi+github@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
penflow = "penflow.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penflow"]

# The guide and the skill live at the top of the repository; the wheel carries copies
# that penflow.resources reads when the package is installed.
[tool.hatch.build.targets.wheel.force-include]
"docs/guide.md" = "penflow/_data/docs/guide.md"
"skills" = "penflow/_data/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "skills", "tests", "examples", "README.md", "CONTRIBUTING.md", "AGENTS.md"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "examples", "tests"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code", "possibly-undefined"]

[tool.pyright]
include = ["src", "examples", "tests"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
enableTypeIgnoreComments = false  # mypy reads "# type: ignore", pyright reads "# pyright: ignore"
pythonVersion = "3.11"
